<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>럭키드로우 아케이드 — 다채로운 당첨자 추첨 미니게임</title>
  <meta name="description" content="룰렛, 사다리 타기, 핀볼 레이스, 캡슐 뽑기, 카드 뒤집기 등 5가지 인터랙티브 미니게임으로 공정하고 재미있게 당첨자를 뽑는 파티 추첨 스튜디오입니다." />
  <meta property="og:title" content="럭키드로우 아케이드 — 다채로운 당첨자 추첨 미니게임" />
  <meta property="og:description" content="룰렛, 사다리 타기, 핀볼 레이스, 캡슐 뽑기, 카드 뒤집기 등 5가지 인터랙티브 미니게임으로 공정하고 재미있게 당첨자를 뽑는 파티 추첨 스튜디오입니다." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #F6F6F3;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F9F9F7;
      --bg-hover: #EFEFEA;
      --bg-stage: #161B22;
      --bg-stage-panel: #232A34;
      --bg-stage-deep: #0F1318;
      --border-light: #E4E4E0;
      --border-stage: #252D38;
      --border-stage-strong: #334155;
      --text-primary: #161615;
      --text-secondary: #666661;
      --text-muted: #8E8E88;
      --accent: #E04F33;
      --accent-hover: #C94127;
      --emerald: #10B981;
      --amber: #F59E0B;
      --danger: #DC2626;
      --font-display: "Outfit", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      --font-sans: "Noto Sans KR", "Outfit", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input, textarea {
      font-family: inherit;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    /* Layout Shell */
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar (Strict 3-Zone Contract) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(246, 246, 243, 0.95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border-light);
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      overflow-x: auto;
    }

    .nav-link {
      position: relative;
      background: none;
      border: none;
      padding: 10px 2px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 150ms ease;
    }

    .nav-link:hover {
      color: var(--text-primary);
    }

    .nav-link.active {
      color: var(--text-primary);
      font-weight: 700;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--accent);
    }

    .history-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      background: var(--text-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 150ms ease;
    }

    .history-btn:hover {
      background: #2C2C2A;
    }

    .mobile-nav {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 16px 10px;
      overflow-x: auto;
      border-top: 1px solid rgba(228, 228, 224, 0.7);
    }

    .mobile-nav-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mobile-nav-btn.active {
      background: var(--text-primary);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Workspace Grid */
    .workspace {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 24px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    /* Sidebar Panel */
    .sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .sidebar-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }

    .sidebar-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Forms & Controls */
    .input-row {
      display: flex;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      font-size: 13.5px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-primary);
    }

    .text-input:focus {
      outline: none;
      border-color: var(--text-primary);
    }

    .textarea-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 13.5px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-primary);
      resize: none;
    }

    .btn-dark {
      height: 40px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      background: var(--text-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-dark:hover:not(:disabled) {
      background: #2C2C2A;
    }

    .btn-dark:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .text-action {
      background: none;
      border: none;
      padding: 2px 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .text-action:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .text-action.danger:hover:not(:disabled) {
      color: var(--danger);
    }

    .text-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .presets-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .preset-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .preset-btn {
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #4A4A46;
      background: #F3F3EF;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset-btn:hover:not(:disabled) {
      background: #EAEAE3;
    }

    /* Rules Box */
    .rules-box {
      padding: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rule-label {
      font-size: 12.5px;
      font-weight: 600;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stepper-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .stepper-btn:hover:not(:disabled) {
      background: var(--bg-hover);
    }

    .stepper-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .stepper-val {
      min-width: 34px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
    }

    .switch-btn {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: none;
      background: #D4D4CE;
      cursor: pointer;
      transition: background 150ms ease;
      flex-shrink: 0;
    }

    .switch-btn.on {
      background: var(--accent);
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FFFFFF;
      transition: transform 150ms ease;
    }

    .switch-btn.on .switch-knob {
      transform: translateX(16px);
    }

    /* Participant List */
    .participant-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .participant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
    }

    .participant-item.inactive {
      background: var(--bg-canvas);
      border-color: transparent;
      opacity: 0.55;
    }

    .participant-toggle {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .color-check {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .participant-item.inactive .color-check {
      background: #FFFFFF !important;
      border-color: #C8C8C2;
      color: transparent;
    }

    .participant-idx {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      width: 18px;
      flex-shrink: 0;
    }

    .participant-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .participant-item.inactive .participant-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .participant-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .weight-box {
      display: flex;
      align-items: center;
      background: var(--bg-canvas);
      border-radius: 6px;
      padding: 2px 4px;
    }

    .weight-btn {
      width: 20px;
      height: 20px;
      border: none;
      background: none;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .weight-btn:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .weight-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .weight-val {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #4A4A46;
      padding: 0 4px;
    }

    .del-btn {
      background: none;
      border: none;
      padding: 4px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }

    .del-btn:hover:not(:disabled) {
      color: var(--danger);
    }

    .btn-subtle-full {
      width: 100%;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      background: #F3F3EF;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-subtle-full:hover {
      background: #EAEAE3;
    }

    /* Main Stage Section */
    .stage-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .stage-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px;
    }

    .stage-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(24px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .stage-desc {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .stage-meta {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .stage-card {
      background: var(--bg-stage);
      color: #FFFFFF;
      border: 1px solid var(--border-stage);
      border-radius: 18px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .stage-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stage-hint {
      font-size: 13.5px;
      color: #94A3B8;
    }

    .seg-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-stage-panel);
      border-radius: 9px;
    }

    .seg-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94A3B8;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms, color 150ms;
    }

    .seg-btn:hover:not(:disabled) {
      color: #FFFFFF;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #FFFFFF;
    }

    .dark-chip-btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--bg-stage-panel);
      color: #CBD5E1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dark-chip-btn:hover:not(:disabled) {
      background: #2E3744;
    }

    .dark-chip-btn.active {
      background: var(--accent);
      color: #FFFFFF;
    }

    .dark-chip-btn.amber {
      background: var(--amber);
      color: #161615;
    }

    .dark-chip-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .primary-cta {
      min-width: 220px;
      height: 48px;
      padding: 0 28px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 150ms ease;
    }

    .primary-cta:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .primary-cta:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .primary-cta.emerald {
      background: var(--emerald);
    }

    .primary-cta.emerald:hover:not(:disabled) {
      background: #059669;
    }

    .cta-center {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    /* Wheel Stage */
    .wheel-readout {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-readout-box {
      padding: 6px 16px;
      border-radius: 8px;
      background: var(--bg-stage-panel);
      border: 1px solid var(--border-stage-strong);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
    }

    .canvas-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #wheel-canvas {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      display: block;
    }

    #pinball-canvas {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 640 / 500;
      border-radius: 12px;
      border: 1px solid #2A3340;
      display: block;
    }

    .winner-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg-stage-panel);
      border-radius: 10px;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-stage);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Ladder Stage */
    .ladder-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .ladder-inner {
      margin: 0 auto;
    }

    .ladder-row {
      display: grid;
      gap: 6px;
      padding: 0 12px;
    }

    .ladder-top-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #FFFFFF;
      cursor: pointer;
    }

    .ladder-top-btn:hover:not(:disabled) {
      background: var(--bg-stage-panel);
    }

    .ladder-top-name {
      font-size: 12px;
      font-weight: 600;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ladder-top-res {
      font-size: 11px;
      font-weight: 600;
      color: var(--emerald);
    }

    .ladder-svg {
      width: 100%;
      height: 340px;
      display: block;
      user-select: none;
    }

    .ladder-outcome-input {
      height: 36px;
      padding: 0 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border-stage-strong);
      background: var(--bg-stage-panel);
      color: #CBD5E1;
      width: 100%;
    }

    .ladder-outcome-input.win {
      background: rgba(224, 79, 51, 0.2);
      border-color: var(--accent);
      color: #FF947D;
    }

    /* Gacha Machine */
    .gacha-machine {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      width: 100%;
      max-width: 320px;
    }

    .gacha-cap {
      width: 156px;
      height: 20px;
      background: var(--accent);
      border-radius: 14px 14px 0 0;
      border: 2px solid rgba(255, 140, 117, 0.45);
    }

    .gacha-dome {
      position: relative;
      width: 264px;
      height: 204px;
      background: #1E2631;
      border: 4px solid var(--border-stage-strong);
      border-radius: 90px 90px 14px 14px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .gacha-dome.shaking {
      animation: capsule-shake 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes capsule-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-6px) rotate(-6deg); }
      40% { transform: translateX(6px) rotate(6deg); }
      60% { transform: translateX(-4px) rotate(-4deg); }
      80% { transform: translateX(4px) rotate(4deg); }
    }

    .gacha-ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      overflow: hidden;
      transition: transform 250ms ease;
    }

    .gacha-ball-top {
      height: 50%;
      width: 100%;
    }

    .gacha-ball-bot {
      height: 50%;
      width: 100%;
      background: #F8FAFC;
    }

    .gacha-body {
      width: 292px;
      background: var(--bg-stage-panel);
      border: 4px solid var(--border-stage-strong);
      border-top: none;
      border-radius: 0 0 24px 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .gacha-dial {
      position: relative;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: var(--bg-stage);
      border: 4px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 150ms;
    }

    .gacha-dial:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .gacha-dial:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .gacha-dial-bar {
      width: 56px;
      height: 14px;
      background: var(--accent);
      border-radius: 999px;
      transition: transform 480ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gacha-dial-center {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid var(--bg-stage);
    }

    .gacha-tray {
      width: 100%;
      min-height: 112px;
      background: var(--bg-stage-deep);
      border: 2px solid var(--border-stage-strong);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .gacha-drop-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .gacha-drop-ball {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #FFFFFF;
      overflow: hidden;
      transition: transform 150ms ease;
    }

    .gacha-drop-btn:hover .gacha-drop-ball {
      transform: scale(1.06);
    }

    /* 3D Cards Stage */
    .turn-banner {
      padding: 10px 16px;
      background: var(--bg-stage-panel);
      border-radius: 10px;
      font-size: 13.5px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .card-btn {
      perspective: 1000px;
      height: 120px;
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .card-btn:disabled {
      cursor: default;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 480ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-btn.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px;
      text-align: center;
    }

    .card-back {
      background: var(--bg-stage-panel);
      border: 2px solid var(--border-stage-strong);
      color: #94A3B8;
    }

    .card-btn:not(.flipped):not(:disabled):hover .card-back {
      border-color: var(--accent);
    }

    .card-num {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: #64748B;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #FFFFFF;
      color: var(--text-primary);
      border: 2px solid var(--accent);
    }

    .card-front.lose {
      background: #1E242C;
      color: #64748B;
      border-color: var(--border-stage-strong);
    }

    .card-front-name {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Modals & Drawers */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    .modal-close:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .trophy-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #FEF3C7;
      color: #D97706;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .modal-meta {
      margin: 0 0 4px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .modal-title {
      margin: 0 0 20px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
    }

    .modal-winners {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .modal-winner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.42);
      display: flex;
      justify-content: flex-end;
    }

    .drawer {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: #FFFFFF;
      border-left: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
    }

    .drawer-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      padding: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .mobile-nav {
        display: flex;
      }
      .topbar-inner {
        padding: 0 16px;
        gap: 16px;
      }
      .workspace {
        padding: 18px 16px;
      }
      .stage-card {
        padding: 18px;
      }
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar: Strict 3-Zone Contract -->
    <header class="topbar">
      <div class="topbar-inner">
        <button type="button" id="brand-btn" class="brand-mark">럭키드로우</button>

        <nav class="nav-links" aria-label="미니게임 선택" id="desktop-nav"></nav>

        <button type="button" id="open-history-btn" class="history-btn tabular-nums">
          당첨 기록 (0)
        </button>
      </div>
      <nav class="mobile-nav" aria-label="모바일 미니게임 선택" id="mobile-nav"></nav>
    </header>

    <!-- Main 2-Column Workspace -->
    <main class="workspace">
      <!-- Left Participant Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-wrap">
            <h2 class="sidebar-title">참가자 명단</h2>
            <span id="participant-count-label" class="sidebar-count tabular-nums">6 / 6명 참여</span>
          </div>
          <button type="button" id="mute-btn" class="icon-btn" aria-label="효과음 켜기/끄기" title="효과음 켜기/끄기"></button>
        </div>

        <!-- Single or Bulk Input -->
        <div style="display:flex; flex-direction:column; gap:10px;">
          <form id="single-add-form" class="input-row">
            <input type="text" id="single-name-input" class="text-input" placeholder="이름 입력 (쉼표로 여러 명 가능)" />
            <button type="submit" id="single-add-btn" class="btn-dark">추가</button>
          </form>

          <div id="bulk-add-box" class="hidden" style="display:flex; flex-direction:column; gap:8px;">
            <textarea id="bulk-name-input" rows="4" class="textarea-input" placeholder="줄바꿈 또는 쉼표(,)로 구분하여 여러 명을 한 번에 입력하세요."></textarea>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
              <button type="button" id="bulk-cancel-btn" class="text-action">취소</button>
              <button type="button" id="bulk-confirm-btn" class="btn-dark" style="height:32px; font-size:12px;">명단에 추가</button>
            </div>
          </div>

          <div class="sub-actions">
            <button type="button" id="toggle-bulk-btn" class="text-action">여러 명 붙여넣기</button>
            <div style="display:flex; align-items:center; gap:6px;">
              <button type="button" id="shuffle-list-btn" class="text-action">섞기</button>
              <span style="color:#D4D4CE;" aria-hidden="true">·</span>
              <button type="button" id="clear-list-btn" class="text-action danger">비우기</button>
            </div>
          </div>

          <div class="presets-row" id="presets-row">
            <span class="preset-label">예시:</span>
          </div>
        </div>

        <!-- Draw Rules -->
        <div class="rules-box">
          <div class="rule-row">
            <span class="rule-label">뽑을 당첨자 수</span>
            <div class="stepper">
              <button type="button" id="winner-minus-btn" class="stepper-btn" aria-label="당첨자 수 감소">-</button>
              <span id="winner-count-val" class="stepper-val tabular-nums">1명</span>
              <button type="button" id="winner-plus-btn" class="stepper-btn" aria-label="당첨자 수 증가">+</button>
            </div>
          </div>

          <div class="rule-row">
            <span style="font-size:12.5px; color:#4A4A46; font-weight:500;">당첨된 참가자 자동 제외</span>
            <button type="button" id="exclude-switch" role="switch" aria-checked="false" class="switch-btn">
              <span class="switch-knob"></span>
            </button>
          </div>
        </div>

        <!-- Participant List -->
        <div id="participant-list" class="participant-list"></div>

        <button type="button" id="restore-all-btn" class="btn-subtle-full hidden"></button>

        <div style="padding-top:10px; border-top:1px solid var(--border-light);">
          <button type="button" id="download-html-btn" class="btn-subtle-full">
            HTML 파일로 저장
          </button>
        </div>
      </aside>

      <!-- Right Game Stage -->
      <section class="stage-column">
        <div class="stage-header">
          <div>
            <h1 id="stage-title" class="stage-title">행운의 룰렛</h1>
            <p id="stage-desc" class="stage-desc"></p>
          </div>
          <div id="stage-meta" class="stage-meta tabular-nums"></div>
        </div>

        <!-- Dynamic Game Container -->
        <div id="game-stage" class="stage-card"></div>
      </section>
    </main>
  </div>

  <!-- Winner Modal -->
  <div id="winner-modal" class="backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="winner-modal-title">
    <div class="modal-card">
      <button type="button" id="modal-close-btn" class="modal-close" aria-label="창 닫기">×</button>
      <div class="trophy-box" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      </div>
      <p id="modal-meta" class="modal-meta"></p>
      <h3 id="winner-modal-title" class="modal-title">당첨을 축하합니다</h3>
      <div id="modal-winners-list" class="modal-winners"></div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="modal-actions">
          <button type="button" id="modal-copy-btn" class="btn-subtle-full" style="height:44px; font-size:13.5px;">결과 복사</button>
          <button type="button" id="modal-replay-btn" class="primary-cta" style="flex:1; min-width:0; height:44px; font-size:14px;">다시 뽑기</button>
        </div>
        <button type="button" id="modal-exclude-btn" class="btn-subtle-full hidden" style="height:40px;">
          당첨자 명단에서 제외하고 이어서 뽑기
        </button>
      </div>
    </div>
  </div>

  <!-- History Drawer -->
  <div id="history-drawer" class="drawer-backdrop hidden">
    <div class="drawer" role="dialog" aria-modal="true" aria-label="당첨 기록">
      <div class="drawer-head">
        <div>
          <h2 style="margin:0; font-family:var(--font-display); font-size:18px; font-weight:700;">당첨 기록</h2>
          <p id="history-sub" style="margin:2px 0 0; font-size:12px; color:var(--text-secondary);" class="tabular-nums">총 0건의 추첨 결과</p>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" id="clear-history-btn" class="text-action danger">전체 삭제</button>
          <button type="button" id="close-history-btn" class="icon-btn" aria-label="기록 닫기" style="font-size:18px;">×</button>
        </div>
      </div>
      <div id="history-list" class="drawer-body"></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const GAME_COLORS = [
        '#E04F33', '#2563EB', '#0D9488', '#D97706',
        '#4F46E5', '#DB2777', '#059669', '#7C3AED',
        '#EA580C', '#0284C7', '#B45309', '#BE185D'
      ];

      const GAME_MODES = [
        { id: 'wheel', label: '행운의 룰렛', shortLabel: '룰렛 돌리기', desc: '가중치 설정이 가능한 원형 룰렛을 돌려 단번에 당첨자를 뽑습니다.' },
        { id: 'ladder', label: '사다리 타기', shortLabel: '사다리 타기', desc: '참가자와 당첨 항목을 연결해 긴장감 있게 경로를 추적합니다.' },
        { id: 'pinball', label: '핀볼 레이스', shortLabel: '핀볼 레이스', desc: '물리 엔진 장애물을 뚫고 결승선을 통과하는 구슬로 승자를 정합니다.' },
        { id: 'gacha', label: '캡슐 뽑기', shortLabel: '캡슐 뽑기', desc: '다이얼을 돌려 굴러 나온 캡슐을 열어 당첨자를 확인합니다.' },
        { id: 'cards', label: '미스터리 카드', shortLabel: '카드 뒤집기', desc: '무작위로 섞인 카드를 직접 뒤집어 당첨과 꽝을 가려냅니다.' }
      ];

      const PRESETS = [
        { label: '커피 내기 6인', names: ['김민수', '이서연', '박지훈', '최유진', '정현우', '강하은'] },
        { label: '팀 회식 8인', names: ['기획 지수', '개발 태오', '디자인 민지', '마케팅 준호', '운영 수빈', '데이터 도윤', '보안 채원', 'PM 시우'] },
        { label: '번호 1~12', names: ['1번', '2번', '3번', '4번', '5번', '6번', '7번', '8번', '9번', '10번', '11번', '12번'] }
      ];

      const STORAGE = {
        PARTICIPANTS: 'luckydraw_html_participants_v1',
        HISTORY: 'luckydraw_html_history_v1'
      };

      function makeParticipants(names, offset) {
        return names.map((name, i) => ({
          id: 'p-' + Date.now() + '-' + (offset + i) + '-' + Math.random().toString(36).slice(2, 6),
          name: name,
          weight: 1,
          active: true,
          color: GAME_COLORS[(offset + i) % GAME_COLORS.length]
        }));
      }

      function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return fallback;
      }

      const state = {
        mode: 'wheel',
        participants: loadJSON(STORAGE.PARTICIPANTS, makeParticipants(PRESETS[0].names, 0)),
        history: loadJSON(STORAGE.HISTORY, []),
        winnerCount: 1,
        excludeWinners: false,
        muted: false,
        running: false,
        latestRecord: null,
        cleanupGame: null
      };

      if (state.participants.length === 0) {
        state.participants = makeParticipants(PRESETS[0].names, 0);
      }

      function saveStorage() {
        try {
          localStorage.setItem(STORAGE.PARTICIPANTS, JSON.stringify(state.participants));
          localStorage.setItem(STORAGE.HISTORY, JSON.stringify(state.history));
        } catch (e) {}
      }

      function getActive() {
        return state.participants.filter(p => p.active);
      }

      // Web Audio API Sound Engine
      const Sound = {
        ctx: null,
        getCtx() {
          if (state.muted) return null;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },
        tick(pitch) {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(520 * (pitch || 1), now);
          o.frequency.exponentialRampToValueAtTime(180 * (pitch || 1), now + 0.03);
          g.gain.setValueAtTime(0.08, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          o.connect(g); g.connect(ctx.destination);
          o.start(now); o.stop(now + 0.04);
        },
        bounce(vel) {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          const f = 320 + Math.min(vel, 8) * 45;
          o.type = 'sine';
          o.frequency.setValueAtTime(f, now);
          o.frequency.exponentialRampToValueAtTime(f * 1.4, now + 0.045);
          g.gain.setValueAtTime(Math.min(0.07, 0.02 + vel * 0.008), now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          o.connect(g); g.connect(ctx.destination);
          o.start(now); o.stop(now + 0.065);
        },
        step(i) {
          const ctx = this.getCtx();
          if (!ctx) return;
          const scale = [392, 440, 493.88, 523.25, 587.33, 659.25];
          const now = ctx.currentTime;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(scale[i % scale.length], now);
          g.gain.setValueAtTime(0.05, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          o.connect(g); g.connect(ctx.destination);
          o.start(now); o.stop(now + 0.075);
        },
        flip() {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(280, now);
          o.frequency.exponentialRampToValueAtTime(560, now + 0.08);
          g.gain.setValueAtTime(0.07, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          o.connect(g); g.connect(ctx.destination);
          o.start(now); o.stop(now + 0.1);
        },
        capsuleDrop() {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [260, 195, 340].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + i * 0.09);
            g.gain.setValueAtTime(0.08, now + i * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.08);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.085);
          });
        },
        win() {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            const s = now + idx * 0.07;
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, s);
            g.gain.setValueAtTime(0.001, s);
            g.gain.linearRampToValueAtTime(0.09, s + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, s + 0.48);
            o.connect(g); g.connect(ctx.destination);
            o.start(s); o.stop(s + 0.5);
          });
        }
      };

      // Confetti
      function launchConfetti() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);

        const particles = Array.from({ length: 85 }, (_, i) => {
          const ang = Math.random() * Math.PI * 2;
          const spd = 4 + Math.random() * 11;
          return {
            x: window.innerWidth * 0.5 + (Math.random() - 0.5) * 80,
            y: window.innerHeight * 0.42 + (Math.random() - 0.5) * 40,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 4.5,
            size: 6 + Math.random() * 6,
            color: GAME_COLORS[i % GAME_COLORS.length],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.25,
            alpha: 1
          };
        });

        let frame = 0;
        function step() {
          frame++;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.34;
            p.vx *= 0.985;
            p.rot += p.vRot;
            if (frame > 65) p.alpha = Math.max(0, 1 - (frame - 65) / 45);
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6);
            ctx.restore();
          }
          if (frame < 110) requestAnimationFrame(step);
          else canvas.remove();
        }
        requestAnimationFrame(step);
      }

      // Escape HTML helper
      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Complete Draw Handler
      function completeDraw(winners, prizeMap) {
        state.running = false;
        if (!winners || winners.length === 0) {
          renderAll();
          return;
        }
        Sound.win();
        launchConfetti();

        const modeInfo = GAME_MODES.find(m => m.id === state.mode) || GAME_MODES[0];
        const activeCount = getActive().length;
        const record = {
          id: 'draw-' + Date.now(),
          timestamp: Date.now(),
          mode: state.mode,
          modeLabel: modeInfo.label,
          participantCount: activeCount,
          winners: winners.map(w => ({
            id: w.id,
            name: w.name,
            color: w.color,
            prize: prizeMap ? prizeMap[w.id] : undefined
          }))
        };

        state.history.unshift(record);
        if (state.history.length > 50) state.history.length = 50;
        state.latestRecord = record;

        if (state.excludeWinners) {
          const winIds = new Set(winners.map(w => w.id));
          state.participants.forEach(p => {
            if (winIds.has(p.id)) p.active = false;
          });
        }

        saveStorage();
        renderShellUI();
        openWinnerModal(record);
      }
